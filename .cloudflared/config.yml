# Пример: секрет credentials-file существует только в приватном каталоге Termux.
# Замените TUNNEL_ID на ID своего туннеля; не добавляйте JSON-учётные данные в Git.
tunnel: TUNNEL_ID
credentials-file: /data/data/com.termux/files/home/.cloudflared/TUNNEL_ID.json
protocol: http2
ingress:
  - hostname: crm.gulya-studio.ru
    service: http://127.0.0.1:3000
  - hostname: dev.gulya-studio.ru
    service: http://127.0.0.1:7681
  - hostname: business.gulya-studio.ru
    service: http://127.0.0.1:4173
  - service: http_status:404
